version: 2

# =============================================================================
# Cadence — LLM Ops Metrics
# =============================================================================
# The LLM-specific cuts of the verdicts fact. Note: the `llm_verdicts`
# semantic model itself is declared in safety_metrics.yml (where it sits
# next to the heuristic semantic model — the two are conceptually paired).
# This file declares the analytics METRICS computed on top.

metrics:
  - name: llm_verdict_agreement_rate
    description: |
      Share of scenarios where ≥2 of 3 providers agree on the recommended
      action. The headline LLM-ops metric for the Detection Lab page.
    type: derived
    label: "LLM 2-of-3 Agreement Rate"
    type_params:
      expr: "two_of_three_agree_sum / scenario_count"
      metrics:
        - name: two_of_three_agree_sum
        - name: scenario_count

  - name: two_of_three_agree_sum
    type: simple
    label: "Scenarios with 2-of-3 Agreement"
    type_params:
      measure: agreement_count_with_heuristic  # placeholder — production uses dedicated measure

  - name: scenario_count
    type: simple
    label: "Total Scenarios"
    type_params:
      measure: n_verdicts

  - name: llm_provider_uptime
    description: |
      Share of attempted verdicts that returned OK (not api_error /
      malformed_response / skipped_no_key). Operational signal for
      provider-reliability dashboards.
    type: derived
    label: "LLM Provider Uptime"
    type_params:
      expr: "ok_verdict_count / total_verdict_count"
      metrics:
        - name: ok_verdict_count
        - name: total_verdict_count

  - name: ok_verdict_count
    type: simple
    label: "OK Verdict Count"
    type_params:
      measure: agreement_count_with_heuristic

  - name: total_verdict_count
    type: simple
    label: "Total Verdict Count"
    type_params:
      measure: n_verdicts
