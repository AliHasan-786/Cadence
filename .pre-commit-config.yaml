repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=20000]
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # sqlfluff is wired into pyproject.toml for local use (`uv run sqlfluff lint
  # models/`) but DISABLED in pre-commit until Sprint 16 runs `sqlfluff fix`
  # across the whole models/ tree. Style violations in 60+ existing SQL files
  # would block every CI run; they're cosmetic, not correctness.
  # When ready to re-enable: uncomment + `uv run sqlfluff fix --templater jinja .`
