[project]
name = "cadence"
version = "0.1.0"
description = "The analytics engineering layer Spotify's DSA reports deserve."
authors = [{ name = "Ali Hasan" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Ingest
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "python-dateutil>=2.9.0",
    "PyYAML>=6.0.2",

    # BigQuery
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigquery-storage>=2.25.0",
    "db-dtypes>=1.3.0",

    # dbt (BigQuery + DuckDB targets)
    "dbt-core>=1.8.0,<1.9.0",
    "dbt-bigquery>=1.8.0,<1.9.0",
    "dbt-duckdb>=1.8.0,<1.9.0",

    # LLM SDKs (Sprint 7 pre-cache)
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",

    # LookML parsing (Sprint 8)
    "lkml>=1.3.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "sqlfluff>=3.1.0",
    "sqlfluff-templater-dbt>=3.1.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "types-PyYAML>=6.0.12",
    "pandas-stubs>=2.2.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"ingest/schemas/*.py" = ["N815"]  # pydantic schemas mirror source column names verbatim

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
files = ["ingest", "scripts"]

[tool.sqlfluff.core]
dialect = "bigquery"
templater = "dbt"
exclude_rules = "L034"
max_line_length = 120

[tool.pytest.ini_options]
testpaths = ["ingest/tests", "scripts/tests"]
asyncio_mode = "auto"
